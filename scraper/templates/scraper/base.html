<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Perenual Plant Scraper{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar {
            background-color: #2e7d32;
        }
        .hero {
            background: linear-gradient(135deg, #43a047 0%, #1b5e20 100%);
            color: #ffffff;
            padding: 2.5rem 2rem;
            border-radius: 0.75rem;
        }
        .plant-card {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .plant-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 0.5rem 1.25rem rgba(0, 0, 0, 0.1) !important;
        }
        main {
            flex: 1;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark shadow-sm mb-4">
    <div class="container">
        <a class="navbar-brand fw-semibold" href="{% url 'scraper:dashboard' %}">🌿 Plant Scraper Dashboard</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto gap-lg-2">
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active fw-semibold{% endif %}" href="{% url 'scraper:dashboard' %}">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if request.resolver_match.url_name == 'plant_list' or request.resolver_match.url_name == 'plant_detail' %}active fw-semibold{% endif %}" href="{% url 'scraper:plant_list' %}">Scraped Plants</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container pb-5">
    {% block content %}
    {% endblock %}
</main>

<footer class="py-3 bg-white border-top text-center text-muted small">
    <div class="container">
        Perenual Plant Scraper &middot; Django &amp; Selenium Control Panel
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
